<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ANGELS ZERO — F-15 Eagle Inspection</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05080c; color:#bfe9d3; font-family:"Courier New",monospace; }
  canvas { display:block; }
  #brand { position:absolute; z-index:10; top:18px; left:22px; font-size:15px; letter-spacing:3px; color:#d8ffe9; text-shadow:0 0 12px rgba(90,255,170,.35); pointer-events:none; }
  #brand small { display:block; font-size:10px; color:#6fbf95; letter-spacing:2px; margin-top:4px; }
  #help { position:absolute; z-index:10; bottom:18px; left:22px; font-size:12px; line-height:1.7; color:#9fdcbb; pointer-events:none; }
  #help b { color:#e6fff1; }
  #viewtag { position:absolute; z-index:10; top:18px; right:22px; font-size:12px; letter-spacing:2px; padding:6px 10px; border:1px solid rgba(126,255,168,.4); background:rgba(4,12,18,.7); }
  #status { position:absolute; z-index:10; left:22px; top:70px; font-size:11px; color:#ffcf8a; }
  #nodes { position:absolute; z-index:10; right:18px; top:60px; width:250px; max-height:72vh; overflow:auto; font-size:10px; line-height:1.45; color:#8fe0b4; background:rgba(3,10,14,.72); border:1px solid rgba(126,255,168,.22); padding:10px 12px; }
  #nodes h3 { margin:0 0 6px; font-size:10px; color:#d2ffe6; letter-spacing:1px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
  <div id="brand">ANGELS ZERO<small>F-15 EAGLE // ASSET INSPECTION</small></div>
  <div id="help">
    <div><b>DRAG</b> &nbsp; orbit camera (chase view)</div>
    <div><b>SPACE</b> &nbsp; toggle chase / pilot eye</div>
    <div><b>W / S</b> &nbsp; throttle (afterburner plume length)</div>
  </div>
  <div id="viewtag">VIEW: CHASE</div>
  <div id="status">LOADING F-15...</div>
  <div id="nodes"><h3>GLTF SCENE GRAPH</h3><div>loading...</div></div>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ---------------------------------------------------------------- renderer */
const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance', preserveDrawingBuffer:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x8fa9bf, 0.0007);

const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.05, 3000);
const CHASE_POS = new THREE.Vector3(0, 4.2, 23);
const CHASE_LOOK = new THREE.Vector3(0, 0.2, 0);
camera.position.copy(CHASE_POS);
camera.lookAt(CHASE_LOOK);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 1.0;

/* -------------------------------------------------------------- sky + sun */
const skyMat = new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{ sun:{ value:new THREE.Vector3(-0.4,0.5,-0.7).normalize() } },
  vertexShader:`varying vec3 vD; void main(){ vD=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`
    varying vec3 vD; uniform vec3 sun;
    void main(){
      vec3 d=normalize(vD);
      float h=clamp(d.y*0.5+0.5,0.0,1.0);
      vec3 col=mix(vec3(0.80,0.88,0.95), vec3(0.10,0.30,0.62), pow(h,0.9));
      float s=max(dot(d,normalize(sun)),0.0);
      col += vec3(1.0,0.86,0.62)*pow(s,200.0)*4.0;
      col += vec3(1.0,0.78,0.48)*pow(s,12.0)*0.30;
      gl_FragColor=vec4(col,1.0);
      #include <tonemapping_fragment>
      #include <colorspace_fragment>
    }`
});
const sky = new THREE.Mesh(new THREE.SphereGeometry(1400,32,20), skyMat);
scene.add(sky);

const sun = new THREE.DirectionalLight(0xfff1d8, 2.4);
sun.position.set(-300, 400, -500);
scene.add(sun);
scene.add(new THREE.HemisphereLight(0xbcd9f2, 0x2b3230, 1.1));
scene.add(new THREE.AmbientLight(0x93a9bd, 0.22));

/* ------------------------------------------------------------- hangar deck */
const deck = new THREE.Mesh(
  new THREE.CylinderGeometry(38, 38, 0.3, 64),
  new THREE.MeshStandardMaterial({ color:0x1c252c, metalness:0.6, roughness:0.6 })
);
deck.position.y = -3.4;
scene.add(deck);
const grid = new THREE.GridHelper(76, 38, 0x3f6b58, 0x26403a);
grid.position.y = -3.22;
grid.material.transparent = true;
grid.material.opacity = 0.4;
scene.add(grid);

/* ------------------------------------------------------- afterburner plumes */
const BLUE = new THREE.Color(0x49b6ff);
const ORANGE = new THREE.Color(0xff7a22);
const plumes = [];
function buildPlume(){
  const g = new THREE.Group();
  const diamonds = 8;
  for (let i=0; i<diamonds; i++){
    const near = (i % 2 === 0) ? 0.20 : 0.44;
    const far  = (i % 2 === 0) ? 0.44 : 0.20;
    const geo = new THREE.CylinderGeometry(far, near, 0.95, 18, 1, true);
    geo.rotateX(Math.PI/2);                    // length along +Z (rearwards)
    const col = new THREE.Color().lerpColors(BLUE, ORANGE, i/(diamonds-1));
    const mat = new THREE.MeshBasicMaterial({
      color: col, transparent:true, opacity:0.16,
      blending: THREE.AdditiveBlending, depthWrite:false, side: THREE.DoubleSide
    });
    const seg = new THREE.Mesh(geo, mat);
    seg.position.z = 0.55 + i*0.95;
    g.add(seg);
  }
  const coreGeo = new THREE.CylinderGeometry(0.10, 0.17, 7.4, 12, 1, true);
  coreGeo.rotateX(Math.PI/2);
  const core = new THREE.Mesh(coreGeo, new THREE.MeshBasicMaterial({
    color:0xc7e8ff, transparent:true, opacity:0.32,
    blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide
  }));
  core.position.z = 4.0;
  g.add(core);
  const glow = new THREE.PointLight(0xff8a30, 2.5, 22, 2);
  glow.position.z = 1.2;
  g.add(glow);
  plumes.push(g);
  return g;
}

/* -------------------------------------------------------------- GLTF load */
let model = null, firstPerson = false;
const targets = {};
const loader = new GLTFLoader();

loader.load('assets/angels_zero_jet.glb', (gltf) => {
  model = gltf.scene;
  const names = [];
  model.traverse(o => {
    names.push(o.name || '(unnamed)');
    console.log('[ANGELS_ZERO NODE]', o.name || '(unnamed)');
    if (o.isMesh) {
      o.frustumCulled = false;
      if (!o.geometry.attributes.normal) o.geometry.computeVertexNormals();
      const mats = Array.isArray(o.material) ? o.material : [o.material];
      const glass = /canopy|glass/i.test(o.name) ||
                    mats.some(mat => mat && /glass/i.test(mat.name || ''));
      for (const m of mats){
        if (!m) continue;
        // Every surface is double-sided so mirrored skin never disappears.
        m.side = THREE.DoubleSide;
        if (m.isMeshStandardMaterial) m.envMapIntensity = 1.2;
        if (glass){
          // Only the real canopy glass is allowed to be see-through.
          m.transparent = true;
          m.opacity = Math.min(m.opacity, 0.55);
          m.depthWrite = false;
          m.alphaTest = 0;
        } else {
          // Airframe, intakes, wings, gear-bay doors: force solid rendering.
          m.transparent = false;
          m.opacity = 1.0;
          m.depthWrite = true;
          m.alphaTest = 0;
        }
        m.needsUpdate = true;
      }
    }
  });
  console.log('[ANGELS_ZERO SCENE GRAPH]', JSON.stringify(names));
  document.getElementById('nodes').innerHTML =
    '<h3>GLTF SCENE GRAPH (' + names.length + ')</h3>' +
    names.map(n => '<div>' + n + '</div>').join('');

  for (const n of ['Nozzle_L','Nozzle_R','Canopy_Glass','Canopy_Pilot_Eye']){
    targets[n] = model.getObjectByName(n);
    if (!targets[n]) console.error('[ANGELS_ZERO] MISSING NODE:', n);
  }

  // Attach plumes exactly at the exported twin nozzle coordinates.
  for (const n of ['Nozzle_L','Nozzle_R']){
    const noz = targets[n];
    if (!noz){ console.error('Nozzle node missing', n); continue; }
    const p = buildPlume();
    p.position.copy(noz.getWorldPosition(new THREE.Vector3()));
    model.add(p);
    console.log('[ANGELS_ZERO] plume at', n, p.position.toArray());
  }

  scene.add(model);
  document.getElementById('status').textContent =
    'F-15 LOADED // ' + names.length + ' NODES // ' + (model.userData.note || 'TEXTURES OK');
  document.getElementById('status').style.color = '#8dffc0';
}, undefined, (err) => {
  console.error('[ANGELS_ZERO] GLTF load failed', err);
  document.getElementById('status').textContent = 'F-15 LOAD FAILED — see console';
});

/* ------------------------------------------------------------- interaction */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(CHASE_LOOK);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.minDistance = 8;
controls.maxDistance = 60;

const keys = { w:false, s:false };
let throttle = 0.9;
addEventListener('keydown', e => {
  if (e.code === 'Space'){
    e.preventDefault();
    firstPerson = !firstPerson;
    document.getElementById('viewtag').textContent = firstPerson ? 'VIEW: PILOT EYE' : 'VIEW: CHASE';
    controls.enabled = !firstPerson;
  }
  if (e.code === 'KeyW') keys.w = true;
  if (e.code === 'KeyS') keys.s = true;
});
addEventListener('keyup', e => {
  if (e.code === 'KeyW') keys.w = false;
  if (e.code === 'KeyS') keys.s = false;
});
addEventListener('resize', () => {
  renderer.setSize(innerWidth, innerHeight);
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
});
if (new URLSearchParams(location.search).has('debug')){
  window.__az = { scene, camera, controls, renderer, get model(){ return model; }, targets, plumes };
}

/* -------------------------------------------------------------------- loop */
const clock = new THREE.Clock();
let elapsed = 0;
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  elapsed += dt;
  const t = elapsed;

  if (keys.w) throttle = Math.min(1, throttle + dt*0.4);
  if (keys.s) throttle = Math.max(0.15, throttle - dt*0.4);

  // Mach-diamond shimmer + throttle-scaled plume length.
  for (const p of plumes){
    const flick = 1 + 0.06*Math.sin(t*11 + p.position.x*3);
    p.scale.set(1, 1, (0.35 + throttle*0.85) * flick);
    p.children.forEach(c => {
      if (c.isMesh) c.material.opacity = (c.geometry.parameters.radiusTop < 0.2 ? 0.26 : 0.13) + 0.10*throttle;
      if (c.isPointLight) c.intensity = 1.5 + throttle*3.5;
    });
  }

  if (firstPerson){
    // Pilot eye inside the F-15 canopy, just abeam the HUD and MFD panel.
    camera.position.set(0, 0.35, -5.0);
    camera.lookAt(0, 0.10, -14);
  } else {
    controls.update();
  }
  sky.position.copy(camera.position);
  renderer.render(scene, camera);
}
animate();
</script>
</body>
</html>
